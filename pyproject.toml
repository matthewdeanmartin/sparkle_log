[project]
name = "sparkle-log"
version = "1.0.0"
description = "Write sparkline graphs of CPU and memory usage to your logs."
authors = [
    {name = "Matthew Martin", email = "matthewdeanmartin@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["monitoring", "logging" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "psutil",
    "schedule",
    "sparklines>=0.5.0",
    "colorlog>=6.8.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/matthewdeanmartin/sparkle_log/issues"
"Change Log" = "https://github.com/matthewdeanmartin/sparkle_log/blob/main/CHANGELOG.md"

[project.scripts]
sparkle_log = 'sparkle_log.__main__:main'



[dependency-groups]
dev = [
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",

    "jiggle_version",
    "hatch",


    "types-psutil",
    "pytest-network",
    "pytest-asyncio",

    "jiggle-version>=2.0.1",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "troml-dev-status>=0.4.1",
    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "mypy",
    "types-toml",
    "types-jsonschema",
    # reports

    # build
    "vermin",
    "metametameta>=0.1.14",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    "pytest-unused-fixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
    "keepachangelog-manager-fork[fast]>=6.8.0; python_version < '3.15'",  # [fast] adds orjson+re2; google-re2 has no cp315 wheel on Windows
    "keepachangelog-manager-fork[stdlib]>=6.8.0; python_version >= '3.15'",  # [stdlib] is pure-Python: same features, no native wheels needed

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel.sources]
"schemas" = "sparkle_log/schemas"

[tool.hatch.build.targets.wheel]
packages = ["sparkle_log"]
include = [
    "sparkle_log/**/*.py",
    "sparkle_log/py.typed",
    "/README.md", "/LICENSE",
]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/LICENSE", "/sparkle_log", "/tests"]



[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''




[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
    "tests"
]
junit_family = "xunit1"
norecursedirs = ["vendor", "scripts"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')


[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["sparkle_log"]
line_length = 120
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 320
# Assume Python 3.10.
target-version = "py311"


[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F",
    "D", # docs
    "UP", # pyupgrade
    "B", # bugbear
]
ignore = ["RUF100", 
    "D301", # messes with doctests
    "E722",
    # only track structural problems with docstrings, not whitespace, nor missing
    "D200", "D212", "D415", "D411", "D205", "D102", "D103", "D100", "D107", "D101", "D104", "D105",
    "UP007", "UP038", # Not sure if | is well supported in lowever versions of python
    "UP035"
]

# Exclude a variety of commonly ignored directories.
exclude = [
    "dead_code",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"



[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["sparklines", "sparklines.*", "schedule", "schedule.*", "colorlog", "colorlog.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.uv]

[tool.uv.pip]
universal = true

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
